image:
  repository: flare
  # Version label. Tags can be moved by a registry; set digest for an exact
  # image and a reliable rollback target. Keep tag aligned with flare/VERSION.
  tag: v0.6.6
  # Optional digest of the image built from sourceCommit (sha256:<64 hex>).
  # When present the Deployment selects repository@digest instead of the tag.
  digest: ""
  # Full lowercase Git object ID stamped into the image build as FLARE_COMMIT.
  # The binary rejects a different runtime declaration. Empty is unattributed.
  sourceCommit: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# Public URL Flare is reached at (used in DSNs + email links).
baseURL: https://flare.example.com
# Optional additional MCP browser origins. Exact HTTPS origins only, maximum
# 8 entries and 2048 comma-separated bytes. baseURL is included automatically.
# This does not enable CORS or grant access; native clients omit Origin.
mcpAllowedOrigins: []

# Operator-owned Stage proof endpoint; leave empty to keep external execution
# receipts advisory. peerIP pins one private Stage peer while TLS validates the
# URL hostname. Stage profile credentials are configured per Flare project.
stageVerifier:
  url: ""
  peerIP: ""

# Optional operator-owned HubSpot developer app. Register the exact
# <baseURL>/api/connectors/hubspot/callback redirect and grant only oauth.
hubspotOAuth:
  clientID: ""

# Days telemetry is kept in Postgres before export-to-Parquet + drop.
retentionDays: 30

# Retention only drops a partition once it is archived to the cold tier. An
# unreachable cold tier PAUSES retention (partitions accumulate, error logged
# every cycle) rather than deleting unarchived telemetry. Set true only if you
# deliberately run with no cold tier.
allowDropWithoutExport: false

secrets:
  # 32+ bytes. Generate: openssl rand -base64 32
  sessionKey: ""
  # EXACTLY 32 bytes. Generate: openssl rand -hex 16
  csrfKey: ""
  # Encrypts integration secrets at rest (BYOAI keys, OIDC client secrets,
  # notification-channel configs). Production REFUSES TO BOOT without it.
  # Generate: openssl rand -base64 32
  # Treat as permanent: rotating it makes existing encrypted values unreadable.
  secretKey: ""
  # Required only when hubspotOAuth.clientID is set. Existing Secret users
  # instead provide the hubspot-oauth-client-secret key there.
  hubspotOAuthClientSecret: ""
  # Provide a pre-created Secret instead of the values above. It must hold
  # keys: session-key, csrf-key, secret-key, database-url (and optionally
  # smtp-password).
  existingSecret: ""

postgres:
  # Deploy a single Postgres in-cluster. Set false to use an external DB.
  bundled: true
  image: postgres:16-alpine
  # REQUIRED when bundled=true. Deliberately empty: a shipped default is a
  # working password on every install that forgets to change it.
  password: ""
  storage: 10Gi
  # Used only when bundled=false:
  externalUrl: ""  # postgres://user:pass@host:5432/flare?sslmode=require

# Optional email (alerts + password reset). Leave host/from blank to disable.
smtp:
  host: ""
  port: 587
  user: ""
  password: ""
  from: ""
  fromName: Flare
  tls: starttls  # tls | starttls | none

# PVC for the Parquet cold tier (aged telemetry).
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: flare.example.com
  annotations: {}
  tls: false
  tlsSecretName: flare-tls

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
